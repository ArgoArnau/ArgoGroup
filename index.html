<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The brandbook monogram. Own filenames on purpose: /favicon.* still
         belong to the /growth and /systems landings. -->
    <link rel="icon" href="/argo-favicon.ico?v=2" sizes="48x48">
    <link rel="icon" href="/argo-icon.svg?v=2" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/argo-apple-touch-icon.png?v=2">
    <meta name="theme-color" content="#0D0D0D" />

    <!-- Display serif + UI sans the design system is built on. Above head-start
         on purpose: everything between the markers is replaced by the SSR head
         on every prerendered page, which would drop these. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Search Console ownership verification. Deliberately above
         head-start: everything between the markers is replaced by the SSR head
         on every prerendered page, which would strip this tag. Removing it
         un-verifies the property and stops the sitemap being read. -->
    <meta name="google-site-verification" content="Y1wLZLx_34tKXV3IgvtwGN-WVLTdPYERMRzpAFsbkmY" />
    <!--head-start-->
    <title>ARGO Group | Performance Marketing Agency in Spain & Miami</title>
    <meta name="description" content="We scale your business with results-driven marketing: lead generation, paid media creatives, and automation systems. Book a call." />
    <link rel="canonical" href="https://www.groupargous.com/" />
    <link rel="alternate" type="text/markdown" href="https://www.groupargous.com/index.md" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.groupargous.com/" />
    <meta property="og:title" content="ARGO Group | Performance Marketing Agency in Spain & Miami" />
    <meta property="og:description" content="We scale your business with results-driven marketing: lead generation, paid media creatives, and automation systems." />
    <meta property="og:image" content="https://www.groupargous.com/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--head-end-->
    <!-- Scroll-reveal elements start hidden and are revealed by JavaScript.
         Without JavaScript there is nothing to reveal them, so show them up front. -->
    <noscript>
      <style>
        [data-reveal],
        [data-reveal] .split-char,
        .section-head .eyebrow,
        .section-head .section-sub {
          opacity: 1 !important;
          transform: none !important;
          filter: none !important;
          transition: none !important;
        }
      </style>
    </noscript>
    <!-- The Meta Pixel is not here on purpose: src/lib/pixel.js loads it only
         after the visitor accepts cookies. -->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
